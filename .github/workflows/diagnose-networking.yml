name: Diagnose retained ISO networking HTTP400
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gravestone-networking-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE_SOURCE_COMMIT: 80b4d44487c4aad230f788400c56d0134bd3d701
  IMAGE_RUN_ID: '42269018314'
  IMAGE_ISO_SHA256: 3e05fcab634a15a81b204a1ea9f80d23e9126706fcd90e16d0970163e53f9bfa
  IMAGE_ARTIFACT: gravestone-0.4.2-amd64
jobs:
  diagnose-networking:
    # Networking diagnostic only; not full image acceptance or a release gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare output and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist logs
          df -h | tee logs/disk-before.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          env = os.environ
          run_base = f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs"
          provenance = {
              'image_source_commit': env['IMAGE_SOURCE_COMMIT'],
              'image_run_id': env['IMAGE_RUN_ID'],
              'image_run_url': f"{run_base}/{env['IMAGE_RUN_ID']}",
              'image_artifact': env['IMAGE_ARTIFACT'],
              'image_sha256': env['IMAGE_ISO_SHA256'],
              'verification_harness_commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'verification_run_url': f"{run_base}/{env['GITHUB_RUN_ID']}",
              'verification_run_attempt': env['GITHUB_RUN_ATTEMPT'],
              'image_rebuilt': False,
              'scope': 'networking diagnostic only; not full image acceptance',
          }
          Path('logs/verification-provenance.json').write_text(
              json.dumps(provenance, indent=2) + '\n')
          PY
      - name: Reject changes to image payload
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${IMAGE_SOURCE_COMMIT}^{commit}"
          if ! git diff --quiet "$IMAGE_SOURCE_COMMIT" HEAD -- app/ ai/ content/ live/; then
            printf 'Image payload differs from pinned image source; refusing to verify stale bytes.\n' >&2
            git diff --stat "$IMAGE_SOURCE_COMMIT" HEAD -- app/ ai/ content/ live/
            exit 1
          fi
      - name: Install source-test PDF parser
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pypdf2
          /usr/bin/python3 -c 'import PyPDF2; print(PyPDF2.__version__)'
      - name: Test source and recipe
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee logs/source-tests.log
      - name: Download pinned image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$IMAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$IMAGE_ARTIFACT" --dir dist
      - name: Check pinned ISO and checksum
        shell: bash
        run: |
          set -euo pipefail
          # Demand the exact pinned sidecar, not merely a self-consistent replacement.
          printf '%s  %s\n' "$IMAGE_ISO_SHA256" gravestone-0.4.2-amd64.iso \
            | cmp - dist/gravestone-0.4.2-amd64.iso.sha256
          (cd dist && sha256sum -c gravestone-0.4.2-amd64.iso.sha256) 2>&1 | tee logs/checksum.log
          cp dist/gravestone-0.4.2-amd64.iso.sha256 logs/
      - name: Verify explicit networking opt-in and offline reading
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/networking
          container="gravestone-networking-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="gravestone-networking-test:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            for file in result.json command.json serial.log qemu.log extract.log; do
              docker cp "$container:/evidence/$file" logs/networking/ 2>/dev/null || true
            done
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # Reuse the existing tools recipe/cache; no driver or browser QA payload.
          docker build --tag "$image" -f scripts/rufus-test.Dockerfile scripts
          (cd dist && sha256sum -c gravestone-0.4.2-amd64.iso.sha256)
          pin=$(sha256sum dist/gravestone-0.4.2-amd64.iso | cut -d ' ' -f 1)
          docker run -d --name "$container" --memory 2500m --memory-swap 2500m --cpus 1 \
            --pids-limit 128 --ulimit nofile=1024:1024 --shm-size 256m \
            --network none --cap-drop ALL --security-opt no-new-privileges \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/src,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/dist/gravestone-0.4.2-amd64.iso",target=/input/release.iso,readonly \
            -e GRAVESTONE_TEST_ISO_SHA256="$pin" "$image" sleep infinity
          docker exec "$container" python3 /src/scripts/test-networking.py 2>&1 | tee logs/networking-run.log
      - name: Record final disk use
        if: always()
        run: |
          mkdir -p logs
          df -h > logs/disk-after.log
      - name: Upload networking diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravestone-networking-diagnostic-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14
